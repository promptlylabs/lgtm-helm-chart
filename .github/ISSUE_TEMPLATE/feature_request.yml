name: Feature request
description: Suggest a new capability or improvement for the lgtm chart.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. This is an opinionated chart, so please describe the problem you're trying to solve — that helps us weigh it against the stack's defaults.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to achieve, and what's missing or difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the chart to do? Sketch the values or behaviour if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.
  - type: checkboxes
    id: components
    attributes:
      label: Affected components
      options:
        - label: Loki (logs)
        - label: Grafana
        - label: Tempo (traces)
        - label: Prometheus / kube-prometheus-stack (metrics)
        - label: Pyroscope (profiling)
        - label: OpenTelemetry collectors
        - label: OpenTelemetry Operator
        - label: Chart packaging / values / datasources / dashboards
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, upstream features this relates to, or relevant ADRs in docs/adrs/.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
