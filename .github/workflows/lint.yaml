name: Lint Charts

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Check generated values.yaml is in sync with values.d/
        run: make check-values

      - name: Validate Grafana dashboards (JSON + datasource refs)
        run: make validate-dashboards

      # Adds the helm repos and vendors dependencies — must run before
      # `ct lint`, whose internal `helm dependency build` needs the repos.
      - name: Build chart dependencies
        run: make deps

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      # ct does not pick up ./ct.yaml on its own — pass it explicitly
      # (validate-maintainers off: the maintainer is an org, not a user).
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Helm lint
        run: helm lint charts/lgtm/

      - name: Helm template (default values)
        run: helm template lgtm charts/lgtm/ --namespace observability > /dev/null

      - name: Helm template (collectors disabled)
        run: helm template lgtm charts/lgtm/ --namespace observability --set collectors.enabled=false > /dev/null

      - name: Helm template (example overlays)
        run: |
          for f in charts/lgtm/examples/values-*.yaml; do
            echo "rendering $f"
            helm template lgtm charts/lgtm/ --namespace observability -f "$f" > /dev/null
          done

      # Assert the Thanos overlay actually wires the sidecar + query stack (the
      # sidecar container is injected by the operator at runtime, so we assert the
      # rendered CR fields, the gRPC Service, and the umbrella workloads).
      - name: Helm template (Thanos enabled — assert wiring)
        run: |
          out=$(helm template lgtm charts/lgtm/ --namespace observability -f charts/lgtm/examples/values-thanos.yaml)
          echo "$out" | grep -q 'objectStorageConfig'   || { echo "missing objectStorageConfig"; exit 1; }
          echo "$out" | grep -q 'disableCompaction: true' || { echo "missing disableCompaction"; exit 1; }
          echo "$out" | grep -q 'port: 10901'            || { echo "missing sidecar gRPC 10901"; exit 1; }
          for n in thanos-query thanos-store-gateway thanos-compactor; do
            echo "$out" | grep -q "name: $n" || { echo "missing workload $n"; exit 1; }
          done
          echo "Thanos enabled-path wiring OK"

      # Assert the bare-metal overlay wires the hostNetwork hardening knobs onto
      # the node collector (ADR-0011), and that they stay OFF by default.
      - name: Helm template (bare-metal enabled — assert wiring)
        run: |
          out=$(helm template lgtm charts/lgtm/ --namespace observability -f charts/lgtm/examples/values-baremetal.yaml --show-only templates/collectors/node-collector.yaml)
          echo "$out" | grep -q 'collect_all_network_interfaces' || { echo "missing collect_all_network_interfaces"; exit 1; }
          echo "$out" | grep -q 'port: 18888'                     || { echo "missing internal metrics port 18888"; exit 1; }
          echo "$out" | grep -q 'file_storage/queue'              || { echo "missing persistent queue extension"; exit 1; }
          def=$(helm template lgtm charts/lgtm/ --namespace observability --show-only templates/collectors/node-collector.yaml)
          echo "$def" | grep -q 'collect_all_network_interfaces' && { echo "collect_all_network_interfaces should be off by default"; exit 1; }
          echo "$def" | grep -q 'file_storage/queue'             && { echo "persistent queue should be off by default"; exit 1; }
          echo "$def" | grep -q 'port: 8888'                      || { echo "default internal metrics port should be 8888"; exit 1; }
          echo "bare-metal enabled-path wiring OK"

      # ADR-0013: the queue is backed by an emptyDir and needs no chown
      # initContainer; hostPath stays available as an opt-in and brings the
      # initContainer back with it.
      - name: Helm template (persistent queue backings — assert wiring)
        run: |
          ed=$(helm template lgtm charts/lgtm/ --namespace observability --set collectors.persistentQueue.enabled=true --show-only templates/collectors/node-collector.yaml)
          echo "$ed" | grep -q 'emptyDir'          || { echo "default node queue backing should be emptyDir"; exit 1; }
          echo "$ed" | grep -q 'sizeLimit: 2Gi'    || { echo "missing emptyDir sizeLimit"; exit 1; }
          echo "$ed" | grep -q 'queue-permissions' && { echo "emptyDir backing must not need a chown initContainer"; exit 1; }
          echo "$ed" | grep -q '/var/lib/otelcol-queue' && { echo "emptyDir backing must not mount the hostPath"; exit 1; }
          hp=$(helm template lgtm charts/lgtm/ --namespace observability --set collectors.persistentQueue.enabled=true --set collectors.persistentQueue.node.backend=hostPath --show-only templates/collectors/node-collector.yaml)
          echo "$hp" | grep -q 'queue-permissions'      || { echo "hostPath backing needs the chown initContainer"; exit 1; }
          echo "$hp" | grep -q '/var/lib/otelcol-queue' || { echo "hostPath backing missing host directory"; exit 1; }
          cl=$(helm template lgtm charts/lgtm/ --namespace observability --set collectors.persistentQueue.enabled=true --show-only templates/collectors/cluster-collector.yaml)
          echo "$cl" | grep -q 'volumeClaimTemplates' || { echo "cluster queue should be PVC-backed"; exit 1; }
          echo "$cl" | grep -q 'queue-permissions'    && { echo "fsGroup applies to PVCs on block storage — no chown initContainer by default"; exit 1; }
          # Escape hatch for CSI drivers that do not apply fsGroup (EFS, Azure Files, NFS).
          nf=$(helm template lgtm charts/lgtm/ --namespace observability --set collectors.persistentQueue.enabled=true --set collectors.persistentQueue.cluster.chownInitContainer=true --show-only templates/collectors/cluster-collector.yaml)
          echo "$nf" | grep -q 'queue-permissions'     || { echo "cluster.chownInitContainer=true should render the chown initContainer"; exit 1; }
          echo "$nf" | grep -q 'volumeClaimTemplates'  || { echo "cluster queue should still be PVC-backed"; exit 1; }
          echo "persistent queue backings OK"

      # The faro collector has no queue volume, so its exporters must never name
      # the file_storage extension (it would fail config validation at startup).
      - name: Helm template (faro + persistent queue — assert no dangling extension)
        run: |
          out=$(helm template lgtm charts/lgtm/ --namespace observability \
            --set collectors.persistentQueue.enabled=true \
            --set collectors.faro.enabled=true \
            --set collectors.faro.image=otel/contrib:latest \
            --set 'collectors.faro.corsAllowedOrigins={https://app.example.com}' \
            --show-only templates/collectors/faro-collector.yaml)
          echo "$out" | grep -q 'file_storage' && { echo "faro must not reference file_storage — it defines no such extension"; exit 1; }
          echo "$out" | grep -q 'sending_queue' || { echo "faro should still batch via sending_queue"; exit 1; }
          echo "faro sending-queue wiring OK"

      # ADR-0013: collectors are critical by default so kubelet keeps admitting
      # them while a node carries DiskPressure.
      - name: Helm template (default PriorityClasses — assert wiring)
        run: |
          n=$(helm template lgtm charts/lgtm/ --namespace observability --show-only templates/collectors/node-collector.yaml)
          echo "$n" | grep -q 'priorityClassName: system-node-critical' || { echo "node collector should default to system-node-critical"; exit 1; }
          c=$(helm template lgtm charts/lgtm/ --namespace observability --show-only templates/collectors/cluster-collector.yaml)
          echo "$c" | grep -q 'priorityClassName: system-cluster-critical' || { echo "cluster collector should default to system-cluster-critical"; exit 1; }
          echo "$n" | grep -q 'fsGroup: 10001' || { echo "node collector should default to fsGroup 10001"; exit 1; }
          # The removed shared key must fail the values schema, not be ignored.
          if helm template lgtm charts/lgtm/ --namespace observability --set collectors.priorityClassName=foo > /dev/null 2>&1; then
            echo "collectors.priorityClassName was removed and must be rejected by the schema"; exit 1
          fi
          echo "PriorityClass defaults OK"

      # SELinux overlay: the node collector must transition to spc_t so filelog
      # can read /var/log/pods (container_log_t) on Enforcing nodes.
      - name: Helm template (SELinux overlay — assert wiring)
        run: |
          out=$(helm template lgtm charts/lgtm/ --namespace observability -f charts/lgtm/examples/values-selinux.yaml --show-only templates/collectors/node-collector.yaml)
          echo "$out" | grep -q 'type: spc_t'   || { echo "missing seLinuxOptions type spc_t"; exit 1; }
          echo "$out" | grep -q 'fsGroup: 10001' || { echo "SELinux overlay must keep fsGroup"; exit 1; }
          echo "$out" | grep -q 'queue-permissions' && { echo "SELinux overlay must not render a chown initContainer"; exit 1; }
          helm template lgtm charts/lgtm/ --namespace observability -f charts/lgtm/examples/values-baremetal.yaml -f charts/lgtm/examples/values-selinux.yaml > /dev/null
          echo "SELinux overlay wiring OK"

      - name: Set up kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
        env:
          GOBIN: /usr/local/bin

      - name: Validate manifests with kubeconform
        run: make kubeconform
