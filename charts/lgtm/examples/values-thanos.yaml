# Long-term metrics via a Thanos sidecar + query stack (ADR-0010).
#
#   - The Prometheus Operator injects a Thanos sidecar that uploads completed 2h
#     TSDB blocks to S3-compatible object storage (Cloudflare R2, AWS S3, MinIO …).
#   - Thanos Query / Store Gateway / Compactor (owned by this chart) make those
#     blocks queryable beyond local Prometheus retention; Grafana's Prometheus
#     datasource is repointed to Query automatically.
#
# Object-storage credentials come from an EXISTING Secret (never templated here) —
# create it with External Secrets Operator. Replace every <placeholder>.
#
# ── The Secret the consumer must provide ────────────────────────────────────
# A Secret named `thanos-objstore` with one key `objstore.yml` holding a Thanos
# object-store config. Example ExternalSecret (external-secrets.io/v1):
#
#   apiVersion: external-secrets.io/v1
#   kind: ExternalSecret
#   metadata:
#     name: thanos-objstore
#     namespace: observability
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       name: <your-store>
#       kind: ClusterSecretStore
#     target:
#       name: thanos-objstore              # <- referenced below (objstore.existingSecret)
#       template:
#         engineVersion: v2
#         data:
#           objstore.yml: |                # <- referenced below (objstore.existingSecretKey)
#             type: S3
#             config:
#               bucket: <bucket>
#               endpoint: <host-only-endpoint>
#               region: <region>
#               access_key: "{{ .accessKeyId }}"
#               secret_key: "{{ .secretAccessKey }}"
#               insecure: false
#               signature_version2: false
#               bucket_lookup_type: auto
#     data:
#       - secretKey: accessKeyId
#         remoteRef: { key: <path/to/secret>, property: access-key-id }
#       - secretKey: secretAccessKey
#         remoteRef: { key: <path/to/secret>, property: secret-access-key }
#
# ── objstore.yml per backend ────────────────────────────────────────────────
#   `endpoint` is the host ONLY — no https:// scheme, no bucket in it (the bucket
#   is the `bucket:` field). `bucket_lookup_type: auto` resolves to path-style for
#   non-AWS/GCS endpoints. `signature_version2` stays false (S3 SigV4).
#
#   Cloudflare R2:  endpoint: <account-id>.r2.cloudflarestorage.com
#                   # EU jurisdiction bucket: <account-id>.eu.r2.cloudflarestorage.com
#                   region: auto
#   AWS S3:         endpoint: s3.<region>.amazonaws.com
#                   region: <region>
#   MinIO (in-cluster, plaintext): endpoint: minio.<namespace>.svc:9000
#                   region: ""   ·   insecure: true
#
# ── Private-CA (custom CA) S3 backend ───────────────────────────────────────
#   For an on-prem S3 whose TLS cert is signed by a PRIVATE CA (e.g. Huawei
#   OceanStor), keep `insecure: false` and trust the CA instead of disabling
#   verification (no http_config.tls_config.insecure_skip_verify). Create a Secret
#   holding the CA bundle (key `ca.crt`), then trust it on BOTH halves of the path:
#     - Query stack (this chart): thanos.objstore.caCert below — auto-mounts the CA
#       into Store Gateway + Compactor and sets SSL_CERT_FILE to it.
#     - Sidecar (operator-owned): kube-prometheus-stack.prometheus.prometheusSpec
#       .volumes + prometheusSpec.thanos.volumeMounts to mount the same CA, then
#       reference it from objstore.yml with http_config.tls_config.ca_file (see the
#       commented block below). This way sidecar + query stack verify TLS
#       consistently. If you take the ca_file route, add it to objstore.yml under
#       `config:`, e.g.:
#             http_config:
#               tls_config:
#                 ca_file: /etc/thanos-ca/ca.crt
#
# ── Retention note ──────────────────────────────────────────────────────────
#   Local Prometheus retention is now a rolling cache in front of the bucket. Keep
#   it >= a few hours so blocks upload before eviction — the chart default (7d) is
#   fine, and lowering to 24h is safe. With compaction disabled a too-tight
#   `retentionSize` can evict a 2h block BEFORE the sidecar uploads it, leaving a
#   permanent gap in the bucket: prefer time-based `retention` and keep any size
#   cap generous (or unset it).

kube-prometheus-stack:
  prometheus:
    # Headless Service exposing the sidecar StoreAPI (gRPC 10901) so Thanos Query
    # can federate it with the Store Gateway.
    thanosService:
      enabled: true

    prometheusSpec:
      # Private-CA S3 only: mount the CA into the sidecar pod and reference it from
      # objstore.yml via http_config.tls_config.ca_file (see the banner note above).
      # volumes:
      #   - name: objstore-ca
      #     secret:
      #       secretName: thanos-objstore-ca
      # Sidecar → object storage. Credentials live in the referenced Secret's
      # objstore.yml (above), never in values.
      thanos:
        # renovate: datasource=docker depName=quay.io/thanos/thanos
        image: quay.io/thanos/thanos:v0.41.0
        objectStorageConfig:
          existingSecret:
            name: thanos-objstore
            key: objstore.yml
        # Private-CA S3 only: mount the CA volume above into the sidecar; then point
        # objstore.yml's http_config.tls_config.ca_file at /etc/thanos-ca/ca.crt.
        # volumeMounts:
        #   - name: objstore-ca
        #     mountPath: /etc/thanos-ca
        #     readOnly: true

      # The operator already disables local compaction whenever objectStorageConfig
      # is set (so 2h blocks upload before compaction) — set explicitly for clarity.
      disableCompaction: true

      # See the retention note above. Chart default is 7d; 24h is a safe floor.
      # retention: "24h"

# Umbrella-owned query stack (Query / Store Gateway / Compactor). Reuses the same
# objstore Secret as the sidecar.
thanos:
  enabled: true
  objstore:
    existingSecret: thanos-objstore
    # Private-CA S3 only (e.g. Huawei OceanStor): trust a custom CA so the objstore
    # client verifies TLS — no http_config.tls_config.insecure_skip_verify needed.
    # Auto-mounts the CA + sets SSL_CERT_FILE on Store Gateway + Compactor. Provide
    # the Secret out of band (e.g. External Secrets Operator).
    # caCert:
    #   existingSecret: thanos-objstore-ca   # Secret holding the CA bundle
    #   key: ca.crt
