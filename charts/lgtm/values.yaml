# ─────────────────────────────────────────────────────────────────────────────
# GENERATED FILE — DO NOT EDIT.
#
# This file is assembled from the fragments in values.d/ by
# scripts/assemble_values.py (run `make values`). Edit the fragment that owns
# the top-level key you want to change, then regenerate.
# ─────────────────────────────────────────────────────────────────────────────

# ═══ 00-lgtm.yaml ════════════════════════════════════════════════

# ── Umbrella-owned, cross-cutting configuration ──────────────────────────────
# Everything under `lgtm` is consumed by this chart's own templates
# (collectors, Grafana datasources/dashboards) — never by the sub-charts.

lgtm:
  # Added as the `cluster` resource attribute on all telemetry when set.
  # The shipped dashboards work with or without it; set it when more than one
  # cluster reports into shared dashboards.
  clusterName: ""

  # Kubernetes cluster DNS domain, used when computing service FQDNs.
  clusterDomain: cluster.local

  # Cross-component endpoint overrides. Leave empty to let the chart compute
  # them from the sub-charts' fullnameOverrides and the release namespace.
  # Set explicitly only when a component lives outside this release (external
  # Prometheus, relocated Loki via namespaceOverride, etc.).
  endpoints:
    prometheus: ""    # e.g. http://prom-stack-prometheus.observability.svc.cluster.local:9090
    loki: ""          # e.g. http://loki.observability.svc.cluster.local:3100
    tempoQuery: ""    # e.g. http://tempo.observability.svc.cluster.local:3200
    tempoOtlpGrpc: ""  # e.g. tempo.observability.svc.cluster.local:4317
    pyroscope: ""     # e.g. http://pyroscope.observability.svc.cluster.local:4040

  # Grafana datasources (Prometheus/Loki/Tempo/Pyroscope with full trace/log/
  # metric/profile correlations), provisioned via the datasources sidecar.
  datasources:
    enabled: true

  # OTel-native dashboards shipped with the chart, provisioned via the
  # dashboards sidecar.
  dashboards:
    enabled: true
    # Grafana folder the dashboards land in (grafana_folder annotation).
    folder: Platform
    # Dashboards to skip, by file basename (e.g. [otel-karpenter-nap]).
    exclude: []

# ═══ 10-collectors.yaml ══════════════════════════════════════════

# ── OpenTelemetry collectors (umbrella-owned OpenTelemetryCollector CRs) ─────
# Three collectors implement the OTLP-push, scrape-less architecture (ADR-0005):
#   node    — DaemonSet: OTLP ingest, hostmetrics, kubeletstats, container logs,
#             per-node scraping of unlabelled ServiceMonitors/PodMonitors
#   cluster — StatefulSet (1 replica): k8s_cluster + k8s_events receivers,
#             ServiceMonitors labelled opentelemetry.io/scope: cluster
#   faro    — Deployment: browser telemetry (Grafana Faro SDK), off by default

collectors:
  # Master switch. The collector CRs need the opentelemetry-operator webhook to
  # be ready, so a first install with plain Helm should run with this set to
  # false, then upgrade with it enabled (ArgoCD with retries converges on its
  # own — see the chart README).
  enabled: true

  # Override the collector image for the node and cluster collectors. Empty
  # uses the operator default (opentelemetry-collector-k8s distribution).
  image: ""

  # PriorityClass for collector pods. Must exist in the cluster — left empty
  # by default since PriorityClasses are cluster-specific.
  priorityClassName: ""

  # resourcedetection processor for the node collector. Disabled when no
  # detectors are configured. Example for Azure (see examples/values-azure.yaml):
  #   detectors: [azure]
  #   config: { azure: { resource_attributes: { cloud.availability_zone: { enabled: true } } } }
  resourceDetection:
    detectors: []
    config: {}

  node:
    enabled: true
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi
    # DaemonSet must also cover tainted system/critical-addons node pools.
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule

  cluster:
    enabled: true
    resources:
      limits:
        memory: 384Mi
      requests:
        cpu: 50m
        memory: 192Mi

  faro:
    enabled: false
    # REQUIRED when enabled: the faroreceiver is only in the contrib
    # distribution, e.g.
    # ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:<tag>
    image: ""
    # Browser origins allowed to POST telemetry (CORS is enforced at the
    # receiver). e.g. ["https://app.example.com", "http://localhost:3000"]
    corsAllowedOrigins: []
    # service.name attached to all Faro telemetry — match the frontend's name
    # for frontend↔backend correlation.
    serviceName: webportal
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

# ═══ 20-kube-prometheus-stack.yaml ═══════════════════════════════

# ── kube-prometheus-stack ─────────────────────────────────────────────────────
# Prometheus Operator + a storage-only Prometheus (ADR-0005): OTLP-native
# ingestion, scraping disabled (the OTel collectors own all collection),
# exporters and Alertmanager disabled. Grafana comes from the standalone chart
# (ADR-0003), not from this stack.
# Upstream values: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

kube-prometheus-stack:
  enabled: true

  # The endpoint helpers in this chart derive the Prometheus service name from
  # this override ("<fullnameOverride>-prometheus"). The literal remote-write
  # URLs in the tempo block must be updated if you change it.
  fullnameOverride: prom-stack

  crds:
    enabled: true

  prometheusOperator:
    enabled: true

    # Defaults are a small starting baseline — sized for a fresh / low-traffic
    # install, not production load. CPU: requests only (no limits, avoid
    # throttling); memory: request ≈ baseline, limit ≈ a little headroom. Memory
    # scales with telemetry volume — raise these as your stack grows. Applies to
    # every resources block in this chart's defaults.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    prometheusConfigReloader:
      enableProbe: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    admissionWebhooks:
      enabled: true
      certManager:
        enabled: false
      patch:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    # observability scope: meta-monitoring, picked up by neither collector for
    # now (node collector excludes labelled ServiceMonitors, cluster collector
    # only takes scope=cluster).
    serviceMonitor:
      additionalLabels:
        opentelemetry.io/scope: observability

  prometheus:
    enabled: true

    serviceMonitor:
      additionalLabels:
        opentelemetry.io/scope: observability

    prometheusSpec:
      replicas: 1

      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

      # Retention
      retention: "7d"
      retentionSize: "10GB"

      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

      # type-and-unit-labels: required with translationStrategy NoTranslation
      # to prevent name collisions between metrics differing only by type/unit.
      enableFeatures:
        - type-and-unit-labels
        - exemplar-storage

      # OTLP ingestion: /api/v1/otlp/v1/metrics
      enableOTLPReceiver: true
      # Remote-write ingestion (Tempo metrics-generator): /api/v1/write
      enableRemoteWriteReceiver: true

      # CRITICAL: the otlp block must be explicitly set — when completely
      # unset, defaults are not computed properly and OTLP metrics are silently
      # rejected (re-verified still required as of Prometheus 3.11.x).
      # https://github.com/prometheus/prometheus/issues/16688
      otlp:
        # Preserve OTel metric names 1:1 (system.cpu.time stays dotted).
        # PromQL: quote the names — {"system.cpu.time"}.
        translationStrategy: NoTranslation
        # Keep service.name/.namespace/.instance.id as labels even if the
        # promoteResourceAttributes list below is later trimmed (they also build
        # the job/instance labels).
        keepIdentifyingResourceAttributes: true
        # Promote OTel resource attributes to queryable labels.
        # https://prometheus.io/docs/guides/opentelemetry/
        promoteResourceAttributes:
          - service.instance.id
          - service.name
          - service.namespace
          - service.version
          - cloud.availability_zone
          - cloud.region
          - container.name
          - deployment.environment
          - deployment.environment.name
          - k8s.cluster.name
          - k8s.container.name
          - k8s.cronjob.name
          - k8s.daemonset.name
          - k8s.deployment.name
          - k8s.job.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          # Volume attributes from kubeletstats (PVC storage dashboard)
          - k8s.volume.name
          - k8s.volume.type
          - k8s.persistentvolumeclaim.name

      # OTel collectors batch with variable delays — accept samples up to 30m
      # out of order.
      tsdb:
        outOfOrderTimeWindow: 30m

      walCompression: true

      # Storage-only mode: selectors that never match. The OTel collectors do
      # all ServiceMonitor/PodMonitor scraping via their target allocators.
      serviceMonitorSelectorNilUsesHelmValues: true
      podMonitorSelectorNilUsesHelmValues: true
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelector:
        matchLabels:
          prometheus.io/scrape: "false-disabled"
      podMonitorSelector:
        matchLabels:
          prometheus.io/scrape: "false-disabled"

  # All alerting is Grafana-managed.
  alertmanager:
    enabled: false

  # Grafana comes from the standalone grafana-community chart (ADR-0003).
  grafana:
    enabled: false

  # Replaced by the OTel k8sclusterreceiver (cluster collector).
  kubeStateMetrics:
    enabled: false

  # Replaced by the OTel hostmetricsreceiver (node collector).
  nodeExporter:
    enabled: false
  prometheus-node-exporter:
    enabled: false

  windowsMonitoring:
    enabled: false

  # Default rules reference node-exporter/kube-state-metrics/cAdvisor metrics
  # that don't exist in this OTel-native setup.
  defaultRules:
    create: false

  # Scraped by the cluster collector (scope=cluster).
  coreDns:
    enabled: true
    serviceMonitor:
      additionalLabels:
        opentelemetry.io/scope: cluster

  kubeApiServer:
    enabled: true
    serviceMonitor:
      additionalLabels:
        opentelemetry.io/scope: cluster

  # Managed control planes (AKS/EKS/GKE) don't expose these; kubelet metrics
  # come from the kubeletstats receiver instead.
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubelet:
    enabled: false

# ═══ 30-grafana.yaml ═════════════════════════════════════════════

# ── Grafana (standalone chart, ADR-0003) ─────────────────────────────────────
# Provisioning is sidecar-driven and cluster-wide: any namespace can ship
# dashboards (label grafana_dashboard: "1"), datasources (grafana_datasource:
# "1") or alert rules (grafana_alert: "1") as ConfigMaps.
# Defaults keep SQLite + a chart-generated admin secret; production identity,
# database and SMTP are client-specific (see examples/values-azure.yaml).
# Upstream values: https://github.com/grafana-community/helm-charts/tree/main/charts/grafana

grafana:
  enabled: true

  fullnameOverride: grafana

  replicas: 1

  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

  # State lives in the database (SQLite by default — ephemeral!). For anything
  # beyond evaluation either enable persistence or point grafana.ini at an
  # external database (azure example shows postgres).
  persistence:
    enabled: false

  serviceMonitor:
    enabled: true
    labels:
      opentelemetry.io/scope: observability

  sidecar:
    # Sidecars OOM below 128Mi during dashboard sync
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      defaultFolderName: "General"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
    alerts:
      enabled: true
      label: grafana_alert
      labelValue: "1"
      searchNamespace: ALL

  grafana.ini:
    # Allow Viewers to edit (but not save) dashboards — supports the
    # iterate-in-UI → export JSON → commit-as-code workflow.
    users:
      viewers_can_edit: true
    analytics:
      check_for_updates: false

# ═══ 40-loki.yaml ════════════════════════════════════════════════

# ── Loki (monolithic / single binary, ADR-0004) ──────────────────────────────
# One StatefulSet, filesystem storage on a PVC, gateway and memcached caches
# disabled — clients talk straight to loki:3100 (queries and OTLP ingest at
# /otlp). Filesystem storage is chart-enforced to exactly 1 replica; switch to
# object storage to scale (see examples/values-azure.yaml).
# Upstream values: https://github.com/grafana-community/helm-charts/tree/main/charts/loki

loki:
  enabled: true

  nameOverride: loki
  # The endpoint helpers in this chart derive the Loki service name from this
  # override. The literal OTEL_EXPORTER_OTLP_ENDPOINT below ties Loki's own
  # trace export to the node collector's fixed service name.
  fullnameOverride: loki

  deploymentMode: Monolithic

  loki:
    # Single-tenant internal use.
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    storage:
      type: filesystem

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # 7 days, matching Prometheus.
    limits_config:
      retention_period: 168h

      # OTLP attribute mapping. Loki's built-in default indexes k8s.pod.name and
      # service.instance.id as stream labels; upstream now flags both as
      # high-cardinality (every pod restart / instance churn mints a new stream).
      # Keep the rest of the curated default index set, but demote these two to
      # structured metadata — still queryable, just not indexed.
      otlp_config:
        resource_attributes:
          ignore_defaults: false
          attributes_config:
            - action: structured_metadata
              attributes:
                - k8s.pod.name
                - service.instance.id

    compactor:
      retention_enabled: true
      delete_request_store: filesystem

    # Loki injects traceIDs into its own structured logs (trace/log correlation).
    tracing:
      enabled: true

  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 512Mi
    persistence:
      enabled: true
      size: 10Gi
      # Chart defaults DELETE the data PVC when the StatefulSet is removed or
      # scaled down — keep log data through helm uninstall/reinstall.
      enableStatefulSetAutoDeletePVC: false
      whenDeleted: Retain
      whenScaled: Retain
    # Loki's own traces go to the node collector (OTel SDK env vars; dskit
    # reads them). Same-namespace short name — the collector CR name is fixed
    # by this chart.
    extraEnv:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-node-collector-collector:4318"
      - name: OTEL_SERVICE_NAME
        value: "loki"

  # SimpleScalable components, off in monolithic mode.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # ADR-0004: nginx in front of one replica adds nothing — endpoints point at
  # the loki service (:3100) directly.
  gateway:
    enabled: false

  # Memcached caches: ~9 GiB of default memory reservations, not justified at
  # this scale. Re-enable resultsCache first if query latency ever hurts.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  test:
    enabled: false
  lokiCanary:
    enabled: false

  # Loki's own metrics. The chart exposes this under monitoring.serviceMonitor
  # (a top-level serviceMonitor key is silently ignored). Labelled
  # opentelemetry.io/scope: observability so the in-cluster collectors skip it
  # (the stack does not scrape itself, ADR-0005); reserved for a future
  # meta-monitoring stack.
  monitoring:
    serviceMonitor:
      enabled: true
      labels:
        opentelemetry.io/scope: observability

# ═══ 50-tempo.yaml ═══════════════════════════════════════════════

# ── Tempo (single-binary chart, ADR-0004) ────────────────────────────────────
# One StatefulSet, local trace blocks + WAL on a PVC. The metrics generator
# pushes RED metrics (span-metrics, service-graphs) to Prometheus remote-write
# and keeps local-blocks for TraceQL metrics queries (Traces Drilldown).
# Upstream values: https://github.com/grafana-community/helm-charts/tree/main/charts/tempo

tempo:
  enabled: true

  # The endpoint helpers in this chart derive the Tempo service name from this
  # override.
  fullnameOverride: tempo

  tempo:
    # Memory ballast is a legacy Go GC technique replaced by GOMEMLIMIT; the
    # chart default (1024MB) just wastes memory and contributes to OOMKills.
    memBallastSizeMbs: 0

    # Starting baseline. Tempo memory scales with trace volume — the
    # metrics-generator, compactor and ingester together can need far more under
    # load (production has needed 2Gi+); raise as you grow.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

    multitenancyEnabled: false

    retention: 48h

    metricsGenerator:
      enabled: true
      processor:
        # TraceQL metrics queries (rate/count/histogram) used by Traces Drilldown.
        local_blocks:
          flush_to_storage: true
        service_graphs:
          wait: 10s
          max_items: 10000
          enable_virtual_node_label: true
          enable_client_server_prefix: true
          dimensions:
            - http.method
            - db.system
          peer_attributes:
            - db.name
            - db.system
            - messaging.destination.name
            - server.address
        span_metrics:
          enable_target_info: true
          dimensions:
            - http.method
            - http.route
            - http.status_code
            - db.system
            - db.operation.name
            - rpc.method
            - rpc.service
          filter_policies:
            - exclude:
                match_type: regex
                attributes:
                  - key: name
                    value: "health|readiness|liveness|HEAD /"
            - exclude:
                match_type: strict
                attributes:
                  - key: kind
                    value: SPAN_KIND_INTERNAL
      storage:
        path: /var/tempo/metrics
        # Same-namespace short name (Helm cannot template sub-chart values).
        # Must be updated if kube-prometheus-stack.fullnameOverride changes or
        # Prometheus lives outside this release. This explicit remote_write is
        # the metrics-generator's only sink — it supersedes the chart's
        # remoteWriteUrl fallback, which we therefore omit.
        remote_write:
          - url: "http://prom-stack-prometheus:9090/api/v1/write"
            send_exemplars: true

    # Metrics-generator processors are disabled by default and must be
    # activated per tenant via overrides.
    # https://grafana.com/docs/tempo/latest/configuration/#standard-overrides
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
            - local-blocks
          # Emit RED metrics as BOTH classic and native histograms. Native
          # gives higher resolution at lower cardinality; classic
          # _bucket/_sum/_count are still required by Grafana's built-in Service
          # Graph view, which derives edge response-time from
          # traces_service_graph_request_*_seconds_sum (native-only leaves it
          # blank). Single global toggle — span-metrics and service-graphs alike.
          generate_native_histograms: both

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

  # Trace blocks + WAL + metrics-generator local-blocks.
  persistence:
    enabled: true
    size: 15Gi

  # Part of the observability stack — labelled opentelemetry.io/scope:
  # observability so the in-cluster collectors deliberately skip it (the stack
  # does not scrape itself, ADR-0005); reserved for a future meta-monitoring
  # stack that selects this scope.
  serviceMonitor:
    enabled: true
    additionalLabels:
      opentelemetry.io/scope: observability

  service:
    type: ClusterIP

# ═══ 60-pyroscope.yaml ═══════════════════════════════════════════

# ── Pyroscope (single binary, ADR-0004) ──────────────────────────────────────
# Continuous profiling, one replica, local PVC, v2 storage (chart 2.x default).
# Alloy is off until workloads expose pprof endpoints to scrape.
# Upstream values: https://github.com/grafana/pyroscope/tree/main/operations/pyroscope/helm/pyroscope

pyroscope:
  enabled: true

  pyroscope:
    # The endpoint helpers in this chart derive the Pyroscope service name
    # from this override.
    fullnameOverride: pyroscope

    replicaCount: 1

    # Pyroscope profiles its own Go runtime — out-of-the-box profiling data.
    disableSelfProfile: false

    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 384Mi

    persistence:
      enabled: true
      size: 10Gi

    service:
      type: ClusterIP

  # No workloads expose pprof endpoints yet; enable per cluster when apps are
  # annotated for profiling.
  alloy:
    enabled: false

  minio:
    enabled: false

  # Pyroscope scrapes its own /metrics (ingest rate, query latency, ring health)
  # — the one stack component otherwise unobserved. A scoped exception to the
  # OTLP-push posture (ADR-0005) for an internal component, mirroring Grafana.
  serviceMonitor:
    enabled: true
    labels:
      opentelemetry.io/scope: observability

# ═══ 70-opentelemetry-operator.yaml ══════════════════════════════

# ── OpenTelemetry Operator ───────────────────────────────────────────────────
# Manages the OpenTelemetryCollector CRs shipped by this chart (10-collectors).
# Webhook certificates are Helm-generated (no cert-manager dependency);
# recreate=false avoids cert churn on every ArgoCD render.
# Upstream values: https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-operator

opentelemetry-operator:
  enabled: true

  fullnameOverride: otel-operator

  # CRDs are rendered as chart templates and upgraded with the release. If the
  # cluster already runs an OTel operator, disable this whole dependency (see
  # the chart README's adoption notes).
  crds:
    create: true

  manager:
    serviceAccount:
      create: true
      name: otel-operator
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    # collectorImage defaults to the opentelemetry-collector-k8s distribution
    # matching the operator version — overridable per collector CR via
    # collectors.image.

  admissionWebhooks:
    create: true
    # Strict validation: a broken collector CR fails loudly instead of being
    # silently skipped. First plain-Helm install: see collectors.enabled.
    failurePolicy: Fail
    certManager:
      enabled: false
    autoGenerateCert:
      enabled: true
      # Don't regenerate the webhook cert on every upgrade/render — under
      # ArgoCD that means perpetual diff and cert churn.
      recreate: false
    timeoutSeconds: 10

  # Watch collectors cluster-wide.
  clusterRole:
    create: true
  role:
    create: false
