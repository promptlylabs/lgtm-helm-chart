# ── OpenTelemetry collectors (umbrella-owned OpenTelemetryCollector CRs) ─────
# Three collectors implement the OTLP-push, scrape-less architecture (ADR-0005):
#   node    — DaemonSet: OTLP ingest, hostmetrics, kubeletstats, container logs,
#             per-node scraping of unlabelled ServiceMonitors/PodMonitors
#   cluster — StatefulSet (1 replica): k8s_cluster + k8s_events receivers,
#             ServiceMonitors labelled opentelemetry.io/scope: cluster
#   faro    — Deployment: browser telemetry (Grafana Faro SDK), off by default

collectors:
  # Master switch. The collector CRs need the opentelemetry-operator webhook to
  # be ready, so a first install with plain Helm should run with this set to
  # false, then upgrade with it enabled (ArgoCD with retries converges on its
  # own — see the chart README).
  enabled: true

  # Override the collector image for the node and cluster collectors. Empty
  # uses the operator default (opentelemetry-collector-k8s distribution).
  image: ""

  # resourcedetection processor for the node collector. Disabled when no
  # detectors are configured. Example for Azure (see examples/values-azure.yaml):
  #   detectors: [azure]
  #   config: { azure: { resource_attributes: { cloud.availability_zone: { enabled: true } } } }
  resourceDetection:
    detectors: []
    config: {}

  # Opt-in durable sending queues (ADR-0011, revised by ADR-0013). Backs each
  # exporter's in-memory sending_queue with a file_storage extension on durable
  # storage, so queued batches survive a collector restart during a backend-down
  # window. Off by default (today's in-memory queue). node → emptyDir by default
  # (see node.backend), cluster → PVC. Neither needs a chown initContainer:
  # kubelet applies podSecurityContext.fsGroup to both volume kinds.
  persistentQueue:
    enabled: false
    # Image for the chown initContainer; must provide `chown` (the collector
    # image is distroless and has no shell). Pinned/tracked like any other image.
    # ONLY used when node.backend=hostPath — every other path relies on fsGroup.
    initImage: busybox:1.37
    node:
      # What backs the DaemonSet queue:
      #   emptyDir (default) — kubelet applies podSecurityContext.fsGroup and the
      #     container runtime labels the volume with the pod's own SELinux MCS
      #     label, so no chown initContainer and nothing to relabel on
      #     SELinux-enforcing nodes. It also counts toward the pod's ephemeral
      #     storage, so kubelet can see and bound it (see sizeLimit) instead of
      #     the queue growing invisibly on the host. NOTE: it lives under the
      #     kubelet root dir (/var/lib/kubelet by default), which on a stock node
      #     layout is the SAME filesystem as a /var/lib hostPath — it only lands
      #     elsewhere if that directory is a separate mount. Survives container
      #     restarts (the ADR-0011 use case) but not pod recreation.
      #   hostPath — also survives pod deletion/rescheduling, at the cost of a
      #     root chown initContainer. fsGroup does NOT apply to hostPath volumes,
      #     which is the only reason that initContainer exists. On
      #     SELinux-enforcing nodes it additionally needs the host directory
      #     relabelled (semanage fcontext + restorecon) or the collector run as
      #     spc_t — see "SELinux-enforcing clusters" in the chart README.
      backend: emptyDir
      # emptyDir backing only. Kubelet evicts the pod if the queue exceeds this,
      # so size it for the worst-case backend-down window; empty means unbounded
      # (bounded in practice by the exporters' sending_queue depth).
      sizeLimit: 2Gi
      # hostPath backing only: host directory backing the queue (created if missing).
      hostPath: /var/lib/otelcol-queue
    cluster:
      # PVC for the StatefulSet queue.
      size: 2Gi
      storageClassName: ""   # empty uses the cluster default StorageClass
      # Run the root chown initContainer on this collector. Not needed on block
      # storage: kubelet applies podSecurityContext.fsGroup to the PVC. Set true
      # for storage classes whose CSI driver does NOT apply fsGroup — file/NFS
      # backed drivers (EFS, Azure Files, nfs-subdir-provisioner) declare
      # CSIDriver fsGroupPolicy: None, and the default ReadWriteOnceWithFSType
      # skips volumes with no fsType. Symptom: the collector starts and cannot
      # write /var/lib/otelcol/queue because it is still root-owned.
      chownInitContainer: false

  node:
    enabled: true
    # PriorityClass for the DaemonSet. system-node-critical is built into every
    # cluster (no cluster-specific object to create) and puts this node agent in
    # the same category as the CNI/CSI DaemonSets. It matters beyond scheduling
    # order: kubelet's admission handler rejects non-critical pods while a node
    # carries the DiskPressure condition, and "critical" is defined precisely as
    # carrying system-node-critical or system-cluster-critical — so without this
    # the collectors get evicted exactly when you need the telemetry. Set to ""
    # to opt out. Note the target-allocator Deployment is a separate pod and the
    # operator's CRD has no priorityClassName for it, so it stays non-critical.
    priorityClassName: system-node-critical
    # Pod-level security context. fsGroup lets kubelet set ownership on the
    # emptyDir-backed queue (and the config/SA-token volumes) so the collector
    # (UID 10001, distroless image) can write it — this is what replaces the old
    # chown initContainer. It does NOT touch the hostPath mounts (/hostfs,
    # /var/log/pods): fsGroup only applies to emptyDir, configMap, secret,
    # projected, downwardAPI and PVC volumes.
    # On SELinux-enforcing nodes the filelog receiver also needs a domain allowed
    # to read /var/log/pods (container_log_t), e.g.
    #   seLinuxOptions: { type: spc_t }
    # See "SELinux-enforcing clusters" in the chart README and examples/values-selinux.yaml.
    podSecurityContext:
      fsGroup: 10001
    # Container-level security context for the otc-container (capabilities,
    # readOnlyRootFilesystem, seLinuxOptions, …). Empty renders nothing.
    securityContext: {}
    # Collect node network IO/error metrics from ALL interfaces, not just the
    # default (eth0). On multi-NIC bare-metal nodes with no default interface the
    # kubelet reports an empty interface name and kubeletstats emits no
    # k8s.node.network.io at all (contrib #40915); the opt-in fix landed in
    # collector 0.131 (#38737). Adds an `interface` resource attribute — one
    # series per node NIC, so cardinality stays bounded.
    collectAllNetworkInterfaces: false
    # Port for the collector's own internal telemetry metrics endpoint. The node
    # collector runs hostNetwork, so this binds a host port; on bare-metal distros
    # where :8888 is already taken, set a free port to avoid
    # "bind: address already in use". Rendered via service.telemetry.metrics.readers
    # (the legacy service.telemetry.metrics.address shortcut was removed in
    # collector v0.111+).
    internalMetricsPort: 8888
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi
    # DaemonSet must also cover tainted system/critical-addons node pools.
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule

  cluster:
    enabled: true
    # Cluster-scoped singleton (k8s_cluster + k8s_events), not a node agent —
    # system-cluster-critical rather than system-node-critical. Also built into
    # every cluster; see collectors.node.priorityClassName for why it matters.
    priorityClassName: system-cluster-critical
    # fsGroup applies to the persistentQueue PVC (volumeClaimTemplates), so no
    # chown initContainer is needed there either. See collectors.node.podSecurityContext.
    podSecurityContext:
      fsGroup: 10001
    securityContext: {}
    resources:
      limits:
        memory: 384Mi
      requests:
        cpu: 50m
        memory: 192Mi

  faro:
    enabled: false
    # Browser telemetry is an optional, non-infrastructural path — left empty so
    # it doesn't claim critical priority. Set one if your cluster has a suitable
    # PriorityClass.
    priorityClassName: ""
    # No queue volume on this collector, so no fsGroup is needed by default.
    podSecurityContext: {}
    securityContext: {}
    # REQUIRED when enabled: the faroreceiver is only in the contrib
    # distribution, e.g.
    # ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:<tag>
    image: ""
    # Browser origins allowed to POST telemetry (CORS is enforced at the
    # receiver). e.g. ["https://app.example.com", "http://localhost:3000"]
    corsAllowedOrigins: []
    # service.name attached to all Faro telemetry — match the frontend's name
    # for frontend↔backend correlation.
    serviceName: webportal
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
