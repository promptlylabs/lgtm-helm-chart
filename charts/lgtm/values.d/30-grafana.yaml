# ── Grafana (standalone chart, ADR-0003) ─────────────────────────────────────
# Provisioning is sidecar-driven and cluster-wide: any namespace can ship
# dashboards (label grafana_dashboard: "1"), datasources (grafana_datasource:
# "1") or alert rules (grafana_alert: "1") as ConfigMaps.
# Defaults keep SQLite + a chart-generated admin secret; production identity,
# database and SMTP are client-specific (see examples/values-azure.yaml).
# Upstream values: https://github.com/grafana-community/helm-charts/tree/main/charts/grafana

grafana:
  enabled: true

  fullnameOverride: grafana

  replicas: 1

  # Peer Service for the unified-alerting gossip ring (see grafana.ini below).
  # Headless, so DNS returns the pod IPs memberlist needs. Rendered
  # unconditionally: at replicas: 1 it is one more ClusterIP-less Service and
  # nothing else.
  headlessService: true

  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

  # State lives in the database (SQLite by default — ephemeral!). For anything
  # beyond evaluation either enable persistence or point grafana.ini at an
  # external database (azure example shows postgres).
  persistence:
    enabled: false

  serviceMonitor:
    enabled: true
    labels:
      opentelemetry.io/scope: observability

  sidecar:
    # Sidecars OOM below 128Mi during dashboard sync
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      defaultFolderName: "General"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
    alerts:
      enabled: true
      label: grafana_alert
      labelValue: "1"
      searchNamespace: ALL

  grafana.ini:
    # Allow Viewers to edit (but not save) dashboards — supports the
    # iterate-in-UI → export JSON → commit-as-code workflow.
    users:
      viewers_can_edit: true
    analytics:
      check_for_updates: false

    # ── Unified-alerting HA ──────────────────────────────────────────────────
    # Alerting is Grafana-managed and on by default, so a second replica would
    # otherwise run a second, independent Alertmanager and every rule would
    # notify twice. Helm cannot set sub-chart values conditionally from a parent
    # template, so this is wired unconditionally — at replicas: 1 it is a single
    # peer gossiping with itself, which is a no-op.
    #
    # POD_IP is injected by the Grafana chart itself as the first env var of the
    # container (fieldRef status.podIP), so `$__env{}` — Grafana's own config
    # expansion — resolves it without any envValueFrom of ours.
    #
    # ha_peers is templated: the sub-chart runs every grafana.ini string through
    # `tpl`, so the address tracks fullnameOverride and namespaceOverride instead
    # of hard-coding grafana-headless.observability.svc.
    #
    # NOT SUFFICIENT ON ITS OWN: Grafana's HA Alertmanager also requires every
    # replica to share ONE database, and the default here is per-pod ephemeral
    # SQLite. Scaling past one replica needs an external database too — see
    # examples/values-azure.yaml. templates/validations.yaml fails the render if
    # you raise replicas without both halves in place.
    unified_alerting:
      ha_listen_address: "$__env{POD_IP}:9094"
      ha_advertise_address: "$__env{POD_IP}:9094"
      ha_peers: '{{ include "grafana.fullname" . }}-headless.{{ include "grafana.namespace" . }}.svc:9094'
