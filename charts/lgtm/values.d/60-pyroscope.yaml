# ── Pyroscope (single binary, ADR-0004) ──────────────────────────────────────
# Continuous profiling, one replica, local PVC, v2 storage (chart 2.x default).
# Alloy is off until workloads expose pprof endpoints to scrape.
# Upstream values: https://github.com/grafana/pyroscope/tree/main/operations/pyroscope/helm/pyroscope

pyroscope:
  enabled: true

  pyroscope:
    # The endpoint helpers in this chart derive the Pyroscope service name
    # from this override.
    fullnameOverride: pyroscope

    replicaCount: 1

    # Pyroscope profiles its own Go runtime — out-of-the-box profiling data.
    disableSelfProfile: false

    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 384Mi

    persistence:
      enabled: true
      size: 10Gi

    service:
      type: ClusterIP

  # No workloads expose pprof endpoints yet; enable per cluster when apps are
  # annotated for profiling.
  alloy:
    enabled: false

  minio:
    enabled: false

  # Pyroscope scrapes its own /metrics (ingest rate, query latency, ring health)
  # — the one stack component otherwise unobserved. A scoped exception to the
  # OTLP-push posture (ADR-0005) for an internal component, mirroring Grafana.
  serviceMonitor:
    enabled: true
    labels:
      opentelemetry.io/scope: observability
