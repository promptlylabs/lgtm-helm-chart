# ── Umbrella-owned, cross-cutting configuration ──────────────────────────────
# Everything under `lgtm` is consumed by this chart's own templates
# (collectors, Grafana datasources/dashboards) — never by the sub-charts.

lgtm:
  # Added as the `cluster` resource attribute on all telemetry when set.
  # The shipped dashboards work with or without it; set it when more than one
  # cluster reports into shared dashboards.
  clusterName: ""

  # Kubernetes cluster DNS domain, used when computing service FQDNs.
  clusterDomain: cluster.local

  # Cross-component endpoint overrides. Leave empty to let the chart compute
  # them from the sub-charts' fullnameOverrides and the release namespace.
  # Set explicitly only when a component lives outside this release (external
  # Prometheus, relocated Loki via namespaceOverride, etc.).
  endpoints:
    prometheus: ""    # e.g. http://prom-stack-prometheus.observability.svc.cluster.local:9090
    loki: ""          # e.g. http://loki.observability.svc.cluster.local:3100
    tempoQuery: ""    # e.g. http://tempo.observability.svc.cluster.local:3200
    tempoOtlpGrpc: ""  # e.g. tempo.observability.svc.cluster.local:4317
    pyroscope: ""     # e.g. http://pyroscope.observability.svc.cluster.local:4040

  # Grafana datasources (Prometheus/Loki/Tempo/Pyroscope with full trace/log/
  # metric/profile correlations), provisioned via the datasources sidecar.
  datasources:
    enabled: true

  # Dashboards shipped with the chart, provisioned via the dashboards sidecar:
  # OTel-native infrastructure views plus first-party component
  # self-observability dashboards. Each is gated on the component it observes
  # (see templates/grafana/dashboards.yaml, ADR-0012) — a dashboard is only
  # provisioned when its component is enabled.
  dashboards:
    enabled: true
    # Grafana folder the dashboards land in (grafana_folder annotation).
    folder: Platform
    # Dashboards to skip, by file basename (e.g. [otel-karpenter-nap]).
    exclude: []

  # Grafana-managed alert rules shipped with the chart, provisioned via the
  # alerts sidecar as ConfigMaps labelled grafana_alert: "1" (ADR-0015).
  # Each bundled rule file is gated on the component it watches, exactly like
  # the dashboards above (see templates/grafana/alerting.yaml).
  #
  # The bundled rules read the stack's own self-metrics, which only exist with
  # in-cluster self-monitoring on — lgtm.metaMonitoring.enabled=false, the
  # default. With a separate meta-monitoring stack they evaluate to NoData;
  # every rate/ratio rule uses noDataState: OK so that stays silent rather than
  # firing.
  alerting:
    enabled: true

    # Grafana folder the bundled rule groups land in. Unlike dashboards this is
    # not an annotation — the folder is named inside the provisioning file, and
    # Grafana creates it if it does not exist.
    folder: Platform

    # Evaluation interval for the bundled rule groups.
    interval: 1m

    # Datasource the bundled rules query. Must be a datasource UID Grafana
    # knows; `prometheus` is the one templates/grafana/datasources.yaml
    # provisions (and is repointed at Thanos Query when thanos.enabled).
    datasourceUid: prometheus

    # Labels merged onto every bundled rule — route them in your notification
    # policy without editing the rules (e.g. {team: platform}).
    commonLabels: {}

    # Bundled rule files to skip, by basename (e.g. [tempo]).
    exclude: []

    # ── Pass-through provisioning ────────────────────────────────────────────
    # Each of these is emitted verbatim into its own `grafana_alert: "1"`
    # ConfigMap in Grafana's provisioning format (apiVersion: 1), and each is
    # skipped when empty. The chart ships none of them: contact points are
    # site-specific (Slack webhooks, PagerDuty keys, mail servers) and belong in
    # the consuming release, not upstream.
    #
    # NOTE: policies are only provisioned when contactPoints is ALSO non-empty.
    # A notification policy that routes to a receiver Grafana has never seen
    # fails provisioning outright, taking the rest of the file with it.
    #
    # https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
    contactPoints: []
    # - orgId: 1
    #   name: platform-oncall
    #   receivers:
    #     - uid: platform-oncall-email
    #       type: email
    #       settings:
    #         addresses: oncall@example.com

    policies: []
    # - orgId: 1
    #   receiver: platform-oncall
    #   group_by: [alertname, component]

    templates: []
    # - orgId: 1
    #   name: platform-subject
    #   template: |
    #     {{ define "platform-subject" }}[{{ .Status }}] {{ .CommonLabels.alertname }}{{ end }}

  # Meta-monitoring reservation (ADR-0005). The observability components carry
  # `opentelemetry.io/scope: observability` on their ServiceMonitors regardless
  # of this setting — it only controls whether the in-cluster collectors scrape
  # those targets.
  #   false (default): no separate meta-monitoring stack, so the node collector
  #     scrapes the observability stack too (it self-monitors).
  #   true: reserve the scope=observability targets for a SEPARATE
  #     meta-monitoring stack (not deployed by this chart); the in-cluster
  #     collectors skip them. Flip this on once that meta stack exists.
  metaMonitoring:
    enabled: false
