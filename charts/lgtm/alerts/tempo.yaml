{{- /*
Tempo ingest, query and compaction health (ADR-0015).

Tempo runs single-binary here, and this dashboard set exposes no first-class
push-error counter — distributor health is visible through
tempo_request_duration_seconds_count broken out by status_code, which is what
dashboards/tempo.json uses and what these rules use too. Note the `tempodb_`
prefix (no underscore after tempo) on the compaction metric.

The metrics-generator alert matters more than it looks: it is what produces
span metrics and service graphs, and it remote-writes them to Prometheus. When
that remote write fails, those panels go quiet without Tempo itself looking
unhealthy. The live-store alert is the trace path's equivalent: Tempo 3's
live-store accepts spans fine while the blocks it cuts never reach storage.
*/ -}}
apiVersion: 1
groups:
  - orgId: 1
    name: lgtm-tempo
    folder: {{ .Values.lgtm.alerting.folder | quote }}
    interval: {{ .Values.lgtm.alerting.interval | quote }}
    rules:
      - uid: lgtm-tempo-request-errors
        title: Tempo returning server errors
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: Over 5% of Tempo requests are returning 5xx
          description: >-
            Trace ingest or trace queries are failing. Check Tempo's logs and its storage
            backend; ingest failures mean spans the collectors sent are being lost.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "critical" "component" "tempo")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "threshold" 0.05 "expr" `sum(rate(tempo_request_duration_seconds_count{route!~"ready|metrics",status_code=~"5.."}[5m])) / clamp_min(sum(rate(tempo_request_duration_seconds_count{route!~"ready|metrics"}[5m])), 1)`) | nindent 10 }}

      - uid: lgtm-tempo-compaction-errors
        title: Tempo compaction failing
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: Tempo cannot compact blocks
          description: >-
            The block list grows unbounded and query latency degrades with it. Usually a storage
            backend problem rather than Tempo itself.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "warning" "component" "tempo")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "expr" `sum(rate(tempodb_compaction_errors_total[15m]))`) | nindent 10 }}

      - uid: lgtm-tempo-livestore-flush-failures
        title: Tempo live-store failing to flush blocks
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: Tempo's live-store cannot write completed blocks to storage
          description: >-
            Recent traces stay queryable from the live-store while their blocks fail to reach the
            storage backend, so they are lost on restart and drop out of search once the
            live-store lets them go. Usually a full volume or a storage backend problem.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "warning" "component" "tempo")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "expr" `sum(rate(tempo_live_store_local_failed_flushes_total[15m]))`) | nindent 10 }}

      - uid: lgtm-tempo-metricsgen-write-failures
        title: Tempo metrics-generator failing to remote-write
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: Tempo's metrics-generator cannot push span metrics to Prometheus
          description: >-
            Span metrics and service graphs stop updating, so the RED panels and the service map
            go stale — while Tempo's own trace ingest keeps looking healthy.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "warning" "component" "tempo")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "expr" `sum(rate(prometheus_remote_storage_samples_failed_total{job=~".*tempo.*"}[15m]))`) | nindent 10 }}

      - uid: lgtm-tempo-absent
        title: Tempo not reporting
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: No healthy Tempo target
          description: >-
            No Tempo scrape target has reported up=1 for 15 minutes — Tempo is down, or the
            collectors have stopped scraping it. Traces are not being stored either way.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "critical" "component" "tempo")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "expr" `absent(up{job=~".*tempo.*"} == 1)`) | nindent 10 }}
