{{- /*
Prometheus ingest and TSDB health (ADR-0015).

This Prometheus is storage-only and OTLP-native (ADR-0005): it scrapes nothing,
the collectors push to it over /api/v1/otlp/v1/metrics, and Tempo's
metrics-generator remote-writes to it. So the ingest alert watches that handler,
not scrape health.

Names and thresholds come from dashboards/prometheus.json: the exact handler
label value, the `code` status label (Prometheus's HTTP metric uses `code`, not
`status_code`), and the Reject Ratio panel's 0.05 red step.
prometheus_tsdb_wal_corruptions_total is deliberately absent — nothing in this
stack exercises it, so it is unvalidated here.

Note the job matcher: kube-prometheus-stack is fullnameOverride'd to `prom-stack`,
so the job label is prom-stack-derived. `job=~".*prometheus.*"` matches it;
`job="prometheus"` would match nothing.
*/ -}}
apiVersion: 1
groups:
  - orgId: 1
    name: lgtm-prometheus
    folder: {{ .Values.lgtm.alerting.folder | quote }}
    interval: {{ .Values.lgtm.alerting.interval | quote }}
    rules:
      - uid: lgtm-prometheus-otlp-ingest-errors
        title: Prometheus rejecting OTLP metric ingest
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: Over 5% of OTLP metric pushes to Prometheus are failing
          description: >-
            The collectors' metrics pipeline is losing data at the door. Look for out-of-order
            samples (see the reject-ratio alert), body-size limits, or a Prometheus restart.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "critical" "component" "prometheus")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "threshold" 0.05 "expr" `sum(rate(prometheus_http_requests_total{handler="/api/v1/otlp/v1/metrics",code!~"2.."}[5m])) / clamp_min(sum(rate(prometheus_http_requests_total{handler="/api/v1/otlp/v1/metrics"}[5m])), 1)`) | nindent 10 }}

      - uid: lgtm-prometheus-sample-rejects
        title: Prometheus rejecting out-of-order samples
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: Over 5% of appended samples are out of order
          description: >-
            Samples are arriving later than the 30m out-of-order window allows and are being
            dropped. Usually a collector queue draining after a backlog, or clock skew on a node.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "warning" "component" "prometheus")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "threshold" 0.05 "expr" `sum(rate(prometheus_tsdb_out_of_order_samples_total[5m])) / clamp_min(sum(rate(prometheus_tsdb_head_samples_appended_total{job=~".*prometheus.*"}[5m])), 1)`) | nindent 10 }}

      - uid: lgtm-prometheus-compaction-failures
        title: Prometheus TSDB compaction failing
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: Prometheus cannot compact TSDB blocks
          description: >-
            Failed compactions grow the on-disk footprint and, with the Thanos sidecar enabled,
            stall block upload — so retention and long-term storage both degrade. Check disk
            space on the Prometheus PVC first.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "critical" "component" "prometheus")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "expr" `sum(rate(prometheus_tsdb_compactions_failed_total{job=~".*prometheus.*"}[15m]))`) | nindent 10 }}

      - uid: lgtm-prometheus-rule-eval-failures
        title: Prometheus rule evaluation failing
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: Prometheus rule evaluations are failing or being missed
          description: >-
            Recording and alerting rules are not producing results — anything built on them is
            silently stale. Missed iterations usually mean rule groups take longer to evaluate
            than their interval.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "warning" "component" "prometheus")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "expr" `sum(rate(prometheus_rule_evaluation_failures_total[15m])) + sum(rate(prometheus_rule_group_iterations_missed_total[15m]))`) | nindent 10 }}

      - uid: lgtm-prometheus-absent
        title: Prometheus not reporting
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: No healthy Prometheus target
          description: >-
            No Prometheus scrape target has reported up=1 for 15 minutes. Every other alert in
            this stack queries Prometheus, so treat this as the root alert when several fire.
        labels:
          {{- include "lgtm.alerting.labels" (dict "root" . "labels" (dict "severity" "critical" "component" "prometheus")) | nindent 10 }}
        data:
          {{- include "lgtm.alerting.query" (dict "root" . "expr" `absent(up{job=~".*prometheus.*"} == 1)`) | nindent 10 }}
