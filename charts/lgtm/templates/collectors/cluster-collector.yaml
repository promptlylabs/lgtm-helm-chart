{{- /*
Cluster collector — single-replica StatefulSet (ADR-0005):
  collects  cluster-level metrics (k8sclusterreceiver — replaces
            kube-state-metrics) and Kubernetes events as structured logs
  scrapes   ServiceMonitors/PodMonitors labelled opentelemetry.io/scope:
            cluster (apiserver, CoreDNS) via the target allocator
  exports   metrics → Prometheus OTLP, event logs → Loki OTLP

Single replica is required: k8seventsreceiver duplicates events otherwise.
*/ -}}
{{- if and .Values.collectors.enabled .Values.collectors.cluster.enabled }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-cluster-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: opentelemetry-collector
    mode: statefulset
    {{- include "lgtm.labels" . | nindent 4 }}
  annotations:
    # First sync races the operator webhook/CRDs — let ArgoCD retry converge.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
spec:
  # StatefulSet mode — Deployment mode does not support the target allocator
  mode: statefulset
  replicas: 1

  {{- with .Values.collectors.image }}
  image: {{ . }}
  {{- end }}

  # system-cluster-critical by default (ADR-0013) — a cluster-scoped singleton,
  # not a node agent. Critical pods are the only ones kubelet admits while a node
  # carries DiskPressure. The target allocator below is a separate Deployment and
  # the operator CRD exposes no priorityClassName for it.
  {{- with .Values.collectors.cluster.priorityClassName }}
  priorityClassName: {{ . }}
  {{- end }}

  {{- with .Values.collectors.cluster.podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.collectors.cluster.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  targetAllocator:
    enabled: true
    allocationStrategy: consistent-hashing
    # Positive selector: only the cluster-scoped component ServiceMonitors.
    prometheusCR:
      enabled: true
      serviceMonitorSelector:
        matchLabels:
          opentelemetry.io/scope: cluster
      podMonitorSelector:
        matchLabels:
          opentelemetry.io/scope: cluster
      {{- if .Values.collectors.targetAllocator.secretNamespaces }}
      # Namespaces the allocator watches Secrets in, for the monitors it selects
      # that reference one. Left unset by default (the operator then scopes the
      # informer to this namespace); when set it REPLACES that default, so the
      # helper re-adds the release namespace. Kept in lockstep with the Roles in
      # rbac.yaml — same helper, so the informer scope and the RBAC cannot drift.
      secretNamespaces:
        {{- include "lgtm.targetAllocator.secretNamespaces" . | nindent 8 }}
      {{- end }}
    {{- with .Values.collectors.cluster.targetAllocator.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}

  config:
    {{- if .Values.collectors.persistentQueue.enabled }}
    extensions:
      # Durable on-disk queue backing the exporter sending queues (ADR-0011).
      # Mounted from a PVC (volumeClaimTemplates); writable by the collector
      # because podSecurityContext.fsGroup makes kubelet set ownership.
      file_storage/queue:
        directory: /var/lib/otelcol/queue
    {{- end }}
    receivers:
      # Cluster metrics (replaces kube-state-metrics)
      k8s_cluster:
        collection_interval: 30s
        node_conditions_to_report:
          - Ready
          - MemoryPressure
          - DiskPressure
          - PIDPressure
          - NetworkUnavailable
        allocatable_types_to_report:
          - cpu
          - memory
          - ephemeral-storage
          - pods
        # Cardinality control: only metrics the shipped dashboards use.
        metrics:
          k8s.replicaset.available:
            enabled: false  # deployment-level metrics cover this
          k8s.replicaset.desired:
            enabled: false
          k8s.daemonset.current_scheduled_nodes:
            enabled: false  # desired + ready already dashboarded
          k8s.job.max_parallel_pods:
            enabled: false  # static spec value
          k8s.container.storage_limit:
            enabled: false  # ephemeralstorage_* used instead
          k8s.container.storage_request:
            enabled: false
          k8s.replication_controller.available:
            enabled: false  # legacy resource, none exist
          k8s.replication_controller.desired:
            enabled: false
          k8s.container.status.reason:
            enabled: true   # OOMKilled / CrashLoopBackOff / ErrImagePull tracking

      # Cluster-scoped component scraping — the target allocator replaces this
      # placeholder with discovered targets (scope=cluster ServiceMonitors).
      prometheus:
        config:
          scrape_configs:
            - job_name: k8s-components
              scrape_interval: 30s

      # Kubernetes events as structured logs (Normal→INFO, Warning→WARN)
      k8s_events:
        auth_type: serviceAccount

    processors:
      # Must be first in every pipeline (fail-safe); ~80% of the 512Mi limit
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 128

      resource:
        attributes:
          {{- if .Values.lgtm.clusterName }}
          - key: cluster
            value: {{ .Values.lgtm.clusterName | quote }}
            action: upsert
          {{- end }}
          - key: collector.mode
            value: statefulset
            action: upsert

      # Events pipeline: set service.name so Loki doesn't show unknown_service
      resource/events:
        attributes:
          - key: service.name
            value: k8s-events
            action: upsert
          {{- if .Values.lgtm.clusterName }}
          - key: cluster
            value: {{ .Values.lgtm.clusterName | quote }}
            action: upsert
          {{- end }}
          - key: collector.mode
            value: statefulset
            action: upsert

      # k8seventsreceiver stamps each record with the event's ORIGINAL eventTime —
      # GetEventTimestamp (internal/k8sinventory) reads EventTime > LastTimestamp >
      # FirstTimestamp and never series.lastObservedTime. client-go's event broadcaster
      # re-PATCHes every live event series once every 30m (refreshTime in
      # k8s.io/client-go/tools/events), so for events.k8s.io-style events — eventTime set,
      # lastTimestamp null, series block — the receiver sees the watch MODIFIED and re-emits
      # the record still carrying the original eventTime, hours stale and staler every round.
      # Loki's ingester accepts unordered writes only back to max_chunk_age/2 (1h at the
      # default 2h), rejects those entries with 400 "entry too far behind", and the exporter
      # treats 400 as Permanent and drops the WHOLE batch. Legacy core/v1 events are
      # unaffected: their lastTimestamp is refreshed on repeat.
      #
      # Re-stamp as observed-now. Nothing is destroyed — the receiver already preserves the
      # original as the k8s.event.start_time attribute (k8s_event_start_time in Loki).
      #
      # The int64 form is required. OTTL's comparison table allows only == and != between two
      # time.Time values, so `where time < Now() - Duration("10m")` is always false and the
      # statement silently never fires — it parses clean, which is what makes it dangerous.
      # 600000000000ns = 10m: comfortably inside Loki's 1h cutoff, well outside pipeline lag.
      transform/events:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(time, Now()) where UnixNano(Now()) - time_unix_nano > 600000000000

    exporters:
      # Prometheus native OTLP ingestion (HTTP, not gRPC)
      otlp_http/metrics:
        metrics_endpoint: {{ include "lgtm.prometheus.otlpEndpoint" . }}/v1/metrics
        {{- include "lgtm.collector.sendingQueue" (dict "root" . "storage" true) | nindent 8 }}

      # Loki native OTLP ingestion
      otlp_http/loki:
        endpoint: {{ include "lgtm.loki.otlpEndpoint" . }}
        {{- include "lgtm.collector.sendingQueue" (dict "root" . "storage" true) | nindent 8 }}

      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      # Distinct self-identity so this collector's own otelcol_* metrics don't
      # collide with the node collector's when both are scraped and pushed to
      # Prometheus (the distribution default is a shared "otelcol-k8s"). This is
      # the value Prometheus rebuilds `job` from on OTLP ingest, so it is what
      # the bundled alert rules and the OTel Collector dashboard select on.
      telemetry:
        resource:
          service.name: otel-cluster-collector
        # The reader is spelled out only for without_units/without_type_suffix.
        # Left implicit, the operator injects this same pull/prometheus reader on
        # :8888 without them, and the SDK then strips the suffixes: this
        # collector reported otelcol_process_uptime while the node collector
        # (which does set them) reported otelcol_process_uptime_seconds_total.
        # Two disjoint sets of names, so every counter-based rule and dashboard
        # panel silently covered the node collector only. Keep these in lockstep
        # with node-collector.yaml. Port 8888 matches what the operator injects,
        # so the monitoring Service is unchanged.
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_units: false
                    without_type_suffix: false
      {{- if .Values.collectors.persistentQueue.enabled }}
      extensions: [file_storage/queue]
      {{- end }}
      pipelines:
        metrics:
          receivers: [k8s_cluster, prometheus]
          processors: [memory_limiter, resource]
          exporters: [otlp_http/metrics, debug]
        logs:
          receivers: [k8s_events]
          processors: [memory_limiter, resource/events, transform/events]
          exporters: [otlp_http/loki]

  {{- if .Values.collectors.persistentQueue.enabled }}
  {{- if .Values.collectors.persistentQueue.cluster.chownInitContainer }}
  # Escape hatch for storage classes whose CSI driver does not apply fsGroup
  # (file/NFS-backed drivers report fsGroupPolicy: None, and the default
  # ReadWriteOnceWithFSType skips volumes with no fsType). Without it the queue
  # dir stays root-owned and the collector (UID 10001, distroless) cannot write.
  initContainers:
    - name: queue-permissions
      image: {{ .Values.collectors.persistentQueue.initImage }}
      command: ["chown", "-R", "10001:10001", "/var/lib/otelcol/queue"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: queue
          mountPath: /var/lib/otelcol/queue
  {{- end }}
  # file_storage runs as the collector user (UID 10001). On block storage kubelet
  # applies podSecurityContext.fsGroup to the PVC, so no chown is needed
  # (ADR-0013); see cluster.chownInitContainer for the exceptions.
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.collectors.persistentQueue.cluster.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.collectors.persistentQueue.cluster.size }}
  volumeMounts:
    - name: queue
      mountPath: /var/lib/otelcol/queue
  {{- end }}

  resources:
    {{- toYaml .Values.collectors.cluster.resources | nindent 4 }}
{{- end }}
