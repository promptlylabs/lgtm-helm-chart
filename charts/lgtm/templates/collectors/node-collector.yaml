{{- /*
Node collector — DaemonSet, one pod per node (ADR-0005):
  receives  OTLP from application pods (operator service has
            internalTrafficPolicy: Local — apps hit their node's collector)
  collects  host metrics, kubelet/cAdvisor stats, container logs
  scrapes   ServiceMonitors/PodMonitors per-node via the target allocator —
            unlabelled (app) plus scope=observability by default, or only
            unlabelled when lgtm.metaMonitoring.enabled (see selector below)
  exports   metrics → Prometheus OTLP, logs → Loki OTLP, traces → Tempo gRPC
*/ -}}
{{- if and .Values.collectors.enabled .Values.collectors.node.enabled }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-node-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: opentelemetry-collector
    mode: daemonset
    {{- include "lgtm.labels" . | nindent 4 }}
  annotations:
    # First sync races the operator webhook/CRDs — let ArgoCD retry converge.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
spec:
  mode: daemonset

  {{- with .Values.collectors.image }}
  image: {{ . }}
  {{- end }}

  # system-node-critical by default (ADR-0013): kubelet only admits critical pods
  # while a node carries DiskPressure, so the node agent survives the incidents
  # it exists to report on. The target allocator below is a separate Deployment
  # and the operator CRD exposes no priorityClassName for it.
  {{- with .Values.collectors.node.priorityClassName }}
  priorityClassName: {{ . }}
  {{- end }}

  {{- with .Values.collectors.node.podSecurityContext }}
  podSecurityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.collectors.node.securityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  # Target Allocator — per-node strategy: each DaemonSet pod scrapes only
  # targets on its own node. Targets without a node assignment are ignored
  # (control-plane components are the cluster collector's job).
  targetAllocator:
    enabled: true
    allocationStrategy: per-node
    # Scope selector (ADR-0005), keyed on lgtm.metaMonitoring.enabled:
    #   default (no meta stack): NotIn [cluster] — scrape apps AND the
    #     observability stack (scope=observability); scope=cluster → cluster collector.
    #   meta stack enabled:      DoesNotExist — scrape only unlabelled apps;
    #     scope=observability is reserved for the external meta stack.
    prometheusCR:
      enabled: true
      serviceMonitorSelector:
        matchExpressions:
          {{- include "lgtm.node.scopeMatchExpressions" . | nindent 10 }}
      podMonitorSelector:
        matchExpressions:
          {{- include "lgtm.node.scopeMatchExpressions" . | nindent 10 }}
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 5m
        memory: 32Mi

  # ServiceAccount/ClusterRole for the collector and allocator pods are
  # auto-created by the operator (spec.serviceAccount unset); the extra
  # permissions they need are in rbac.yaml.

  config:
    {{- if .Values.collectors.persistentQueue.enabled }}
    extensions:
      # Durable on-disk queue backing the exporter sending queues (ADR-0011).
      # Mounted from an emptyDir by default (hostPath opt-in, see
      # collectors.persistentQueue.node.backend); writable by the collector
      # because podSecurityContext.fsGroup makes kubelet set ownership.
      file_storage/queue:
        directory: /var/lib/otelcol/queue
    {{- end }}
    receivers:
      # OTLP — application traces; apps send to
      # otel-node-collector-collector.<namespace>.svc:4317 (gRPC) / :4318 (HTTP)
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

      # Host metrics from the node filesystem (replaces node-exporter)
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
          memory:
            metrics:
              system.memory.utilization:
                enabled: true
          disk:
            metrics:
              system.disk.merged:
                enabled: false  # OS-level merged I/O; too low-level, not in any dashboard
              system.disk.operation_time:
                enabled: false  # system.disk.io_time used in the host-metrics dashboard instead
              system.disk.weighted_io_time:
                enabled: false  # same — io_time is simpler and sufficient
          # Exclude EFI partitions: vfat with restrictive dmask causes statfs() EACCES
          filesystem:
            exclude_mount_points:
              mount_points: ["/boot/efi"]
              match_type: strict
            exclude_fs_types:
              fs_types: ["vfat"]
              match_type: strict
            metrics:
              system.filesystem.utilization:
                enabled: true
              system.filesystem.usage:
                enabled: false  # utilization (%) normalizes across disk sizes
          # Empty objects (not null) — the operator webhook warns on null
          # config nodes and kustomize/kubectl edit choke on them.
          network: {}
          load: {}

      # Kubelet/cAdvisor stats with OTel semantic names (k8s.pod.cpu.usage …);
      # sole source of kubelet metrics — the kubelet ServiceMonitor is disabled.
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_NAME}:10250"
        # true (default) fits kubelets serving self-signed certs, which nothing
        # in the pod can verify. Set collectors.node.kubeletInsecureSkipVerify
        # to false where kubelet serving certs are signed by the cluster CA —
        # auth_type: serviceAccount then verifies against the pod's
        # service-account CA bundle, which is that same CA.
        insecure_skip_verify: {{ .Values.collectors.node.kubeletInsecureSkipVerify }}
        {{- if .Values.collectors.node.collectAllNetworkInterfaces }}
        # Multi-NIC nodes: collect network metrics from every interface, not just
        # the default one. node scope only — keeps cardinality to one series per
        # node NIC (adds an `interface` resource attribute). See contrib #40915.
        collect_all_network_interfaces:
          node: true
        {{- end }}
        metric_groups:
          - node
          - pod
          - container
          - volume
        # k8s.volume.type also adds k8s.volume.name and k8s.persistentvolumeclaim.name
        extra_metadata_labels:
          - container.id
          - k8s.volume.type
        # Deprecated attributes warn when left enabled
        resource_attributes:
          aws.volume.id:
            enabled: false
          fs.type:
            enabled: false
          gce.pd.name:
            enabled: false
          glusterfs.endpoints.name:
            enabled: false
          glusterfs.path:
            enabled: false
          partition:
            enabled: false
        # Cardinality control: only metrics the shipped dashboards use.
        # Working-set memory is tracked instead of usage/rss (page-cache
        # inflation); gauges instead of cumulative counters; derivable
        # metrics dropped.
        metrics:
          k8s.node.cpu.time:
            enabled: false
          k8s.node.memory.usage:
            enabled: false
          k8s.node.memory.rss:
            enabled: false
          k8s.node.memory.available:
            enabled: false
          k8s.node.memory.page_faults:
            enabled: false
          k8s.node.filesystem.available:
            enabled: false
          k8s.pod.cpu.time:
            enabled: false
          k8s.pod.memory.usage:
            enabled: false
          k8s.pod.memory.rss:
            enabled: false
          k8s.pod.memory.available:
            enabled: false
          k8s.pod.memory.page_faults:
            enabled: false
          k8s.pod.memory.major_page_faults:
            enabled: false
          k8s.pod.filesystem.available:
            enabled: false
          container.cpu.time:
            enabled: false
          container.memory.usage:
            enabled: false
          container.memory.rss:
            enabled: false
          container.memory.available:
            enabled: false
          container.memory.page_faults:
            enabled: false
          container.filesystem.available:
            enabled: false
          container.filesystem.capacity:
            enabled: false
          container.filesystem.usage:
            enabled: false

      # Application scraping — the target allocator replaces this placeholder
      # with per-node discovered targets.
      prometheus:
        config:
          scrape_configs:
            - job_name: applications
              scrape_interval: 30s

      # Container logs from the node filesystem (CRI format)
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/otc-container/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
          # Parse JSON bodies so trace context can be promoted (non-JSON logs
          # pass through unmodified)
          - type: json_parser
            id: json-body-parser
            if: 'body matches "^\\{"'
            parse_from: body
            on_error: send

    processors:
      # Percentage mode tracks the container's cgroup limit, so it auto-scales
      # with limits.memory — no second hardcoded value to keep in sync.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

      {{- if .Values.collectors.resourceDetection.detectors }}
      # Cloud metadata enrichment (collectors.resourceDetection)
      resourcedetection:
        detectors:
          {{- toYaml .Values.collectors.resourceDetection.detectors | nindent 10 }}
        timeout: 5s
        override: false
        {{- with .Values.collectors.resourceDetection.config }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      # Pod/namespace metadata enrichment for logs and traces
      k8s_attributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.node.name
            - k8s.container.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      # Promote traceId/spanId from JSON log attributes to the OTLP LogRecord
      # fields — Loki stores them as trace_id/span_id structured metadata,
      # which the Grafana derived field links on.
      transform/trace_context:
        log_statements:
          - context: log
            statements:
              - set(trace_id.string, attributes["traceId"]) where attributes["traceId"] != nil
              - set(span_id.string, attributes["spanId"]) where attributes["spanId"] != nil

      resource:
        attributes:
          {{- if .Values.lgtm.clusterName }}
          - key: cluster
            value: {{ .Values.lgtm.clusterName | quote }}
            action: upsert
          {{- end }}
          - key: collector.mode
            value: daemonset
            action: upsert
          - key: k8s.node.name
            value: ${env:K8S_NODE_NAME}
            action: upsert

    exporters:
      # Prometheus native OTLP ingestion (HTTP, not gRPC)
      otlp_http/metrics:
        metrics_endpoint: {{ include "lgtm.prometheus.otlpEndpoint" . }}/v1/metrics
        {{- include "lgtm.collector.sendingQueue" (dict "root" . "storage" true) | nindent 8 }}

      # Loki native OTLP ingestion
      otlp_http/loki:
        endpoint: {{ include "lgtm.loki.otlpEndpoint" . }}
        {{- include "lgtm.collector.sendingQueue" (dict "root" . "storage" true) | nindent 8 }}

      otlp_grpc/tempo:
        endpoint: {{ include "lgtm.tempo.otlpGrpcEndpoint" . }}
        tls:
          insecure: true
        {{- include "lgtm.collector.sendingQueue" (dict "root" . "storage" true) | nindent 8 }}

      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      {{- if .Values.collectors.persistentQueue.enabled }}
      extensions: [file_storage/queue]
      {{- end }}
      # Internal telemetry metrics endpoint. hostNetwork binds a host port, so
      # the port is configurable to avoid clashing with host-side :8888 on
      # bare-metal distros. The service.telemetry.metrics.address shortcut was
      # removed in collector v0.111+, so bind via a pull/prometheus reader.
      telemetry:
        # Distinct self-identity so this collector's own otelcol_* metrics don't
        # collide with the cluster collector's when both are scraped and pushed
        # to Prometheus (the distribution default is a shared "otelcol-k8s").
        resource:
          service.name: otel-node-collector
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: {{ .Values.collectors.node.internalMetricsPort }}
                    # Keep the classic _total/_seconds/_bytes suffixes so this
                    # collector's otelcol_* names match the operator-default
                    # cluster collector (and every standard OTel dashboard).
                    without_units: false
                    without_type_suffix: false
      pipelines:
        metrics:
          receivers: [hostmetrics, prometheus, kubeletstats]
          processors: [memory_limiter{{- if .Values.collectors.resourceDetection.detectors }}, resourcedetection{{- end }}, resource]
          exporters: [otlp_http/metrics, debug]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8s_attributes, transform/trace_context, resource]
          exporters: [otlp_http/loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource]
          exporters: [otlp_grpc/tempo]

  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  # Host network for accurate node metrics
  hostNetwork: true

  {{- if and .Values.collectors.persistentQueue.enabled (eq .Values.collectors.persistentQueue.node.backend "hostPath") }}
  # hostPath backing only. fsGroup is not applied to hostPath volumes, so the
  # queue dir has to be chowned to the collector user (UID 10001) before the
  # collector starts — the collector image is distroless and has no shell.
  # On SELinux-enforcing nodes this chown is denied unless the host directory is
  # relabelled or the pod runs as spc_t; the default emptyDir backing avoids the
  # whole problem (ADR-0013).
  initContainers:
    - name: queue-permissions
      image: {{ .Values.collectors.persistentQueue.initImage }}
      command: ["chown", "-R", "10001:10001", "/var/lib/otelcol/queue"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: queue
          mountPath: /var/lib/otelcol/queue
  {{- end }}

  volumes:
    - name: hostfs
      hostPath:
        path: /
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    {{- if .Values.collectors.persistentQueue.enabled }}
    - name: queue
      {{- if eq .Values.collectors.persistentQueue.node.backend "hostPath" }}
      hostPath:
        path: {{ .Values.collectors.persistentQueue.node.hostPath }}
        type: DirectoryOrCreate
      {{- else }}
      {{- with .Values.collectors.persistentQueue.node.sizeLimit }}
      emptyDir:
        sizeLimit: {{ . }}
      {{- else }}
      emptyDir: {}
      {{- end }}
      {{- end }}
    {{- end }}

  volumeMounts:
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    {{- if .Values.collectors.persistentQueue.enabled }}
    - name: queue
      mountPath: /var/lib/otelcol/queue
    {{- end }}

  # GOMEMLIMIT is auto-injected from limits.memory by the operator, so the Go
  # GC soft limit tracks the values automatically.
  resources:
    {{- toYaml .Values.collectors.node.resources | nindent 4 }}

  {{- with .Values.collectors.node.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
