{{- /*
RBAC for the collectors and their target allocators.

The operator auto-creates the ServiceAccounts (named <cr-name>-collector and
<cr-name>-targetallocator) but not the ClusterRoles/Bindings they need:
  - target allocators discover ServiceMonitors/PodMonitors cluster-wide, and
    read the Secrets those monitors reference (a namespaced Role, see below)
  - the cluster collector reads cluster state (k8sclusterreceiver) and
    events (k8seventsreceiver), and scrapes the apiserver /metrics
  - the node collector reads node stats (kubeletstats) and pod metadata
    (k8sattributes)

ClusterRole/Binding names are release-prefixed (cluster-scoped, must not
collide); the subjects reference the operator-generated SA names, which are
fixed because the CR names are fixed.
*/ -}}
{{- if .Values.collectors.enabled }}
{{- if or .Values.collectors.node.enabled .Values.collectors.cluster.enabled }}
---
{{- /*
One shared ClusterRole for both target allocators.

These rules are exactly the set the operator's admission webhook audits — see
targetAllocatorCRPolicyRules in internal/webhook/targetallocator_rbac.go. Note
what that means: a clean audit proves nothing beyond "matches the audit list",
and the audit list has no `secrets` rule at all. It does not cover everything
the allocator needs at runtime, so do not treat webhook silence as coverage.

The secrets grant the allocator actually needs is a namespaced Role, further
down in this file — not a rule here. See the comment there for why.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-otel-targetallocator
  labels:
    app: opentelemetry-collector
    component: target-allocator
    {{- include "lgtm.labels" . | nindent 4 }}
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["*"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["probes", "scrapeconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  # A ConfigMap-sourced CA (tlsConfig.ca.configMap) is resolved with a direct
  # Get today — prometheus-operator's assets.StoreBuilder.GetConfigMapKey, no
  # informer — so "get" alone is what the allocator exercises, and it is all the
  # webhook audit asks for. list/watch are granted anyway so that a future move
  # to a ConfigMap informer (the shape the Secret path already has) does not
  # reproduce the crashloop this file's Role was added for. The cost is a
  # cluster-wide ConfigMap read on these two ServiceAccounts.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-otel-targetallocator
  labels:
    app: opentelemetry-collector
    component: target-allocator
    {{- include "lgtm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-otel-targetallocator
subjects:
  {{- if .Values.collectors.node.enabled }}
  - kind: ServiceAccount
    name: otel-node-collector-targetallocator
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if .Values.collectors.cluster.enabled }}
  - kind: ServiceAccount
    name: otel-cluster-collector-targetallocator
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- /*
Secret read for the target allocators — namespaced Role, not a ClusterRole rule.

With prometheusCR enabled the allocator resolves each selected monitor's
tlsConfig / basicAuth / authorization references itself, so it needs the Secrets
they point at. Two distinct accesses:

  - a PartialObjectMetadata informer over secrets, for change detection. This is
    the one that kills the process: without list/watch the cache never syncs and
    the allocator exits ("Unable to sync caches" / "secrets is forbidden"),
    crashlooping every few minutes.
  - a direct Get per referenced Secret, when building the scrape config.

The informer is namespace-scoped — the allocator's own namespace unless
prometheusCR.secretNamespaces widens it (GetSecretsAllowList(collectorNamespace)
in cmd/otel-allocator/internal/config). A Role in the release namespace is
therefore the exact grant it needs, not a narrowed compromise: list/watch on
secrets cannot be bounded by resourceNames, so a ClusterRole rule here would
mean cluster-wide secret read for both allocators to satisfy an informer that
only ever watches one namespace.

The out-of-the-box trigger lives in the release namespace anyway: the bundled
kube-prometheus-stack's prom-stack-operator ServiceMonitor sets tlsConfig.ca to
the prom-stack-admission webhook CA Secret.

collectors.targetAllocator.secretNamespaces adds namespaces to both sides at
once — the CRs' prometheusCR.secretNamespaces and the Roles below. Listed
namespaces must already exist.
*/}}
{{- range $ns := include "lgtm.targetAllocator.secretNamespaces" . | fromYamlArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-otel-targetallocator-secrets
  namespace: {{ $ns }}
  labels:
    app: opentelemetry-collector
    component: target-allocator
    {{- include "lgtm.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-otel-targetallocator-secrets
  namespace: {{ $ns }}
  labels:
    app: opentelemetry-collector
    component: target-allocator
    {{- include "lgtm.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-otel-targetallocator-secrets
subjects:
  {{- if $.Values.collectors.node.enabled }}
  - kind: ServiceAccount
    name: otel-node-collector-targetallocator
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  {{- if $.Values.collectors.cluster.enabled }}
  - kind: ServiceAccount
    name: otel-cluster-collector-targetallocator
    namespace: {{ $.Release.Namespace }}
  {{- end }}
{{- end }}
{{- end }}
{{- if .Values.collectors.cluster.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-otel-cluster-collector
  labels:
    app: opentelemetry-collector
    component: collector
    {{- include "lgtm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
      - services
      - resourcequotas
      - replicationcontrollers
      - persistentvolumes
      - persistentvolumeclaims
    verbs: ["list", "watch", "get"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["list", "watch", "get"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["list", "watch", "get"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["list", "watch", "get"]
  # k8seventsreceiver
  - apiGroups: [""]
    resources:
      - events
    verbs: ["list", "watch", "get"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["list", "watch", "get"]
  # apiserver /metrics scraping
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-otel-cluster-collector
  labels:
    app: opentelemetry-collector
    component: collector
    {{- include "lgtm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-otel-cluster-collector
subjects:
  - kind: ServiceAccount
    name: otel-cluster-collector-collector
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.collectors.node.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-otel-node-collector
  labels:
    app: opentelemetry-collector
    component: collector
    {{- include "lgtm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/stats
      - nodes/metrics  # kubelet /metrics/cadvisor endpoint
      - nodes/proxy    # kubelet API access
      - pods
      - namespaces     # k8sattributes processor
    verbs: ["list", "watch", "get"]
  # k8sattributes resolves deployment names through ReplicaSets
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-otel-node-collector
  labels:
    app: opentelemetry-collector
    component: collector
    {{- include "lgtm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-otel-node-collector
subjects:
  - kind: ServiceAccount
    name: otel-node-collector-collector
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
