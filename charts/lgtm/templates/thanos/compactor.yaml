{{- /*
Thanos Compactor (ADR-0010) — singleton that compacts and downsamples the blocks
in object storage and enforces the bucket's retention. Required long-term:
without it the bucket grows forever and long-range queries stay slow. Only ever
one compactor per bucket (replicas MUST be 1; Recreate strategy + RWO PVC keep it
a singleton across rollouts).
*/ -}}
{{- if and .Values.thanos.enabled .Values.thanos.compactor.enabled }}
{{- if .Values.thanos.compactor.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thanos-compactor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-compactor
    app.kubernetes.io/component: compactor
    {{- include "lgtm.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.thanos.compactor.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.thanos.compactor.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compactor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-compactor
    app.kubernetes.io/component: compactor
    {{- include "lgtm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.thanos.compactor.replicas }}
  # Singleton — never run two compactors against the same bucket.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compactor
        app.kubernetes.io/component: compactor
        {{- include "lgtm.labels" . | nindent 8 }}
    spec:
      containers:
        - name: thanos-compactor
          image: {{ include "lgtm.thanos.image" . }}
          imagePullPolicy: {{ .Values.thanos.image.pullPolicy }}
          args:
            - compact
            - --wait
            - --log.level=info
            - --http-address=0.0.0.0:10902
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --retention.resolution-raw={{ .Values.thanos.compactor.retention.raw }}
            - --retention.resolution-5m={{ .Values.thanos.compactor.retention.fiveMin }}
            - --retention.resolution-1h={{ .Values.thanos.compactor.retention.oneHour }}
          ports:
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
            - name: data
              mountPath: /var/thanos/compact
          resources:
            {{- toYaml .Values.thanos.compactor.resources | nindent 12 }}
      volumes:
        - name: objstore
          secret:
            secretName: {{ .Values.thanos.objstore.existingSecret }}
            items:
              - key: {{ .Values.thanos.objstore.existingSecretKey }}
                path: objstore.yml
        - name: data
          {{- if .Values.thanos.compactor.persistence.enabled }}
          persistentVolumeClaim:
            claimName: thanos-compactor
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-compactor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-compactor
    app.kubernetes.io/component: compactor
    {{- include "lgtm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: thanos-compactor
  ports:
    - name: http
      port: 10902
      targetPort: http
{{- end }}
