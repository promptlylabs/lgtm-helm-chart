{{- /*
Thanos Store Gateway (ADR-0010) — exposes the TSDB blocks the sidecar uploaded to
object storage over the StoreAPI, so Query can serve data older than local
Prometheus retention. The PVC caches block index/chunks locally (not the blocks
themselves). Reads the shared objstore Secret (provided out of band, e.g. ESO).
*/ -}}
{{- if and .Values.thanos.enabled .Values.thanos.storeGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: thanos-store-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-store-gateway
    app.kubernetes.io/component: store-gateway
    {{- include "lgtm.labels" . | nindent 4 }}
spec:
  # Headless — Query discovers the pod(s) via DNS SRV on the gRPC port.
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-store-gateway
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos-store-gateway
    app.kubernetes.io/component: store-gateway
    {{- include "lgtm.labels" . | nindent 4 }}
spec:
  serviceName: thanos-store-gateway
  replicas: {{ .Values.thanos.storeGateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-store-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-store-gateway
        app.kubernetes.io/component: store-gateway
        {{- include "lgtm.labels" . | nindent 8 }}
    spec:
      containers:
        - name: thanos-store-gateway
          image: {{ include "lgtm.thanos.image" . }}
          imagePullPolicy: {{ .Values.thanos.image.pullPolicy }}
          args:
            - store
            - --log.level=info
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
            - name: data
              mountPath: /var/thanos/store
            {{- if .Values.thanos.objstore.caCert.existingSecret }}
            - name: objstore-ca
              mountPath: /etc/thanos-ca
              readOnly: true
            {{- end }}
            {{- with .Values.thanos.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.thanos.storeGateway.resources | nindent 12 }}
          {{- if or .Values.thanos.objstore.caCert.existingSecret .Values.thanos.extraEnv }}
          env:
            {{- if .Values.thanos.objstore.caCert.existingSecret }}
            - name: SSL_CERT_FILE
              value: /etc/thanos-ca/{{ .Values.thanos.objstore.caCert.key }}
            {{- end }}
            {{- with .Values.thanos.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      volumes:
        - name: objstore
          secret:
            secretName: {{ .Values.thanos.objstore.existingSecret }}
            items:
              - key: {{ .Values.thanos.objstore.existingSecretKey }}
                path: objstore.yml
        {{- if .Values.thanos.objstore.caCert.existingSecret }}
        - name: objstore-ca
          secret:
            secretName: {{ .Values.thanos.objstore.caCert.existingSecret }}
            items:
              - key: {{ .Values.thanos.objstore.caCert.key }}
                path: {{ .Values.thanos.objstore.caCert.key }}
        {{- end }}
        {{- if not .Values.thanos.storeGateway.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.thanos.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if .Values.thanos.storeGateway.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.thanos.storeGateway.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.thanos.storeGateway.persistence.size }}
  {{- end }}
{{- end }}
